name: Publish Satellite Timelapse to GitHub Pages
on:
  push:
    branches: [develop]
  workflow_dispatch:
  schedule:
    - cron: "19 6 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: https://bambuchastudent.github.io/Satellite-timelapse-/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Best-effort Carrefour snapshot
        run: |
          timeout 620s python carrefour/update_catalog.py || echo "Using fallback catalog"
          python -c 'import json; d=json.load(open("carrefour/catalog.json")); assert len(d["products"]) >= 3'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
